project:
  id: fragments-engine
  display_name: Fragments Engine
  status: active
  purpose: |
    Local-first ingestion, triage, and recall hub for information fragments.
    Fragments Engine is both the inbox/routing system for fragments and the
    knowledge/search engine for their provenance and recall. It runs a single
    pipeline — ingest, classify, route, index for recall — staging
    low-confidence fragments in an inbox for human review. It is a peer
    application that owns its own pipeline, inbox, routing state, and recall
    layer; external systems are reached only through transport-based
    destination adapters (file, api, mcp, cli).
catalog:
  torque_project_id: PRJ-20260514-0004
  cerberus_project_id: fragments-engine
  tether_catalog_project: fragments-engine
locations:
  repo: ~/dev/hollis-labs/apps/fragments-engine
  agent_os_tracking: ~/dev/agent-os/workspaces/execution/fragments-engine
  state_dir: null                    # no ~/.fragments-engine; FE uses repo-local ./data
  catalog: null
  artifacts: ~/.cerberus/apps/fragments-engine
build:
  authority: cerberus
  resource: fragments-engine-dev
  command: go build -o fragments-engine ./cmd/fragments-engine
deployment:
  type: launchd
  service_name: null                 # Cerberus-managed launchd service; explicit name not declared in resource config
  binary: ~/dev/hollis-labs/apps/fragments-engine/fragments-engine
docs:
  readme: README.md
  architecture: docs/architecture.md
  adrs: null                         # no docs/adrs/ directory yet
  roadmap: docs/roadmap.md
roadmap:
  current_phase: 'Phase 5 — FFS Library and Virtual Filesystem (in progress)'
  pointer: null
usage_examples:
  - intent: Run the test suite
    command: make test
    note: Runs go test ./...
  - intent: Build the binary (includes embedded GUI)
    command: make build
    note: Runs sysop-build first to embed apps/sysop/dist into the Go binary
  - intent: Ingest fragments from configured sources
    command: go run ./cmd/fragments-engine ingest run -config ./fragments.yaml
    note: Copy fragments.example.yaml to fragments.yaml first
  - intent: Search FE recall
    command: go run ./cmd/fragments-engine search -q "<query>"
    note: Backend is sqlite FTS or embedded vanta; check with `recall status`
  - intent: Run the dev API
    command: go run ./cmd/fragments-engine serve-api --addr :8091 --config fragments.example.yaml
    note: Cerberus resource fragments-engine-dev manages this on port 8091
scopes:
  - fragments-engine.backend.main
related_projects: [torque, carrier, frag, nil, nanite, tesseract]
