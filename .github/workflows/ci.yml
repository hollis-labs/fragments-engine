name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      GOMAXPROCS: '4'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/sysop/package-lock.json
      - run: npm --prefix apps/sysop ci
      - run: python3 -c 'import subprocess; subprocess.run(["make", "sysop-build"], timeout=300, check=True)'
      - run: python3 -c 'import subprocess; subprocess.run(["go", "build", "./cmd/fragments-engine"], timeout=180, check=True)'
      - run: go test -timeout 240s ./...
      - run: go test -race -timeout 240s ./...
      - run: python3 -c 'import subprocess; subprocess.run(["make", "lint"], timeout=180, check=True)'
      - run: python3 -c 'import subprocess; subprocess.run(["npm", "--prefix", "apps/sysop", "run", "test:run"], timeout=180, check=True)'
      - run: python3 -c 'import subprocess; subprocess.run(["npm", "--prefix", "apps/sysop", "run", "typecheck"], timeout=180, check=True)'

  # The Postgres transcript corpus tests need a real server with pgvector. GitHub service
  # containers run on Linux only, so they live in their own job; the jobs above skip them.
  transcript-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      FE_TRANSCRIPTS_REQUIRE_PG: '1'
      FE_TRANSCRIPTS_TEST_PG_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres sslmode=disable
      FE_TRANSCRIPTS_TEST_PG_HOSTPORT: 127.0.0.1 port=5432
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: mkdir -p apps/sysop/dist && touch apps/sysop/dist/.keep
      - run: go test -race -count=1 -timeout 600s ./internal/transcript/... ./internal/ingest/...
